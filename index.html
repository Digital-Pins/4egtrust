<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>4EG Trust — مؤقتاً تحت الصيانة</title>
  <meta name="robots" content="noindex,nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#fbfdff;--card:#fff;--brand-900:#0a2540;--brand-500:#1e90ff;--accent:#22c55e;--muted:#6b7280}
    html,body{height:100%}
    body{margin:0;font-family:Almarai,Montserrat,system-ui,Arial;background:linear-gradient(180deg,var(--bg),#fff);color:var(--brand-900);display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:900px;background:var(--card);border-radius:12px;padding:36px;box-shadow:0 10px 30px rgba(10,37,64,0.06);box-sizing:border-box;text-align:right}
    .brand{display:flex;align-items:center;gap:14px}
    .brand svg{width:56px;height:56px}
    h1{margin:12px 0 6px;font-size:1.9rem}
    p.lead{margin:0;color:var(--muted);font-size:1rem}
    .actions{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap}
    .btn{padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:600}
    .primary{background:var(--brand-500);color:#fff}
    .ghost{background:transparent;border:1px solid #e6eefb;color:var(--brand-900)}
    footer{margin-top:18px;color:var(--muted);font-size:0.9rem}
    @media (max-width:520px){.card{padding:20px}h1{font-size:1.5rem}}
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <div class="brand">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g2" x1="0" x2="1">
            <stop offset="0%" stop-color="#1e90ff"/>
            <stop offset="100%" stop-color="#22c55e"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="12" fill="url(#g2)" />
        <path d="M18 38 L28 24 L38 38 L30 38 L28 33 L26 38 Z" fill="white" opacity="0.95"/>
      </svg>
      <div>
        <div style="font-weight:700">4EG Trust</div>
        <div style="color:var(--muted);font-size:0.95rem">صفحة مؤقتة — العودة قريباً</div>
      </div>
    </div>

    <h1 id="title">نقوم الآن بأعمال صيانة وتحديثات</h1>
    <p class="lead">نعتذر عن الإزعاج؛ يعمل فريقنا على تحسين الموقع وسيعود للخدمة قريباً. إذا كانت لديك مسألة عاجلة، تواصل معنا عبر البريد أدناه.</p>

    <div class="actions">
      <a class="btn primary" href="mailto:info@4egtrust.com">راسلنا</a>
      <a class="btn ghost" href="tel:+1119873888">اتصل</a>
    </div>

    <footer>
      © 4EG Trust — جميع الحقوق محفوظة
    </footer>
  </main>
</body>
</html>
